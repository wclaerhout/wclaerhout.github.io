---
layout: default
title: evo blog
---

<div class="wrap">
  <section class="intro">
    <div class="kicker">{{ site.data.content.home.hero_label }}</div>
    <h1>{{ site.data.content.home.title }}</h1>
    <p>{{ site.data.content.home.intro }}</p>
  </section>

  <div class="section-label">{{ site.data.content.home.latest_label }}</div>
  <div class="post-list">
    {% for nb in site.data.notebooks limit:3 %}{% include entry.html nb=nb %}{% endfor %}
  </div>
  <a href="/notebooks/" class="more-link">All posts →</a>
</div>
