---
layout: default
---
{%- comment -%} Readable version of a Pluto notebook, generated by _tools/pluto2post.py. {%- endcomment -%}
<article class="wrap post-wrap">
  <a href="/notebooks/" class="back-link">← all posts</a>

  <div class="post-meta">
    <span class="post-date-label">{{ page.date | date: "%Y-%m-%d" }}</span>{% for tag in page.tags %}<span class="post-tag">{{ tag }}</span>{% endfor %}
  </div>

  <h1 class="post-title">{{ page.title }}</h1>

  <a class="interactive-link" href="{{ page.interactive }}">Open the interactive Pluto notebook ↗</a>

  <div class="prose notebook">
    {{ content }}
  </div>
</article>
